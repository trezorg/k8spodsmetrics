name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Format check
        run: mise run format:check

      - name: Lint
        run: mise run lint

      - name: Test with coverage
        run: mise run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Build
        run: mise run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Run govulncheck
        run: mise run govulncheck
